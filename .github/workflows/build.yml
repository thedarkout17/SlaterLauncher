name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["preview/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" "build-tools;34.0.0" >/dev/null

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set - building with a throwaway key"
          fi

      - name: Release name
        id: rel
        # Zero-padded so GitHub lists releases in the right order (v012 after v011, not next to build-1)
        run: echo "tag=v$(printf '%03d' ${{ github.run_number }})" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          export BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-28/android.jar"
          export VERSION_CODE=$(( ${{ github.run_number }} + 1 ))
          chmod +x build.sh
          ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SlaterLauncher-apk
          path: dist/SlaterLauncher.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: SlaterLauncher build ${{ github.run_number }}
          body: "Built from ${{ github.sha }}. Download SlaterLauncher.apk below and open it on the head unit."
          files: dist/SlaterLauncher.apk
          make_latest: true
